[package]
name = "bxwrp"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
use_self = "warn"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bashkit = { version = "0.17", features = [
    "realfs",
    "http_client",
    "python",
    "sqlite",
    "typescript",
    "jq",
    "logging",
    "bot-auth",
] }
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
minijinja = "2"
rmcp = { version = "3", features = ["server", "transport-io"] }
rustix = { version = "1", features = ["net", "process"] }
schemars = { version = "1", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
